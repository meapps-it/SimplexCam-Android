name: Compila APK SimplexCam

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SimplexCam-0.2-beta-Sorgenti.zip'
      - '.github/workflows/simplexcam-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Preparazione SDK e APK Android di prova
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Recupera repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa Android SDK 35
        shell: bash
        run: |
          command -v sdkmanager
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Verifica presenza sorgenti
        id: sources
        shell: bash
        run: |
          if [[ -f SimplexCam-0.2-beta-Sorgenti.zip ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Configurazione Android pronta. Per compilare APK caricare SimplexCam-0.2-beta-Sorgenti.zip dopo aver reso privato il repository."
          fi

      - name: Cache Gradle
        if: steps.sources.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Estrai sorgenti
        if: steps.sources.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p buildsrc
          unzip -q SimplexCam-0.2-beta-Sorgenti.zip -d buildsrc
          chmod +x buildsrc/Casacam-Verifica-0.1-Progetto/Casacam/gradlew

      - name: Compila APK debug
        if: steps.sources.outputs.available == 'true'
        working-directory: buildsrc/Casacam-Verifica-0.1-Progetto/Casacam
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Pubblica APK da scaricare
        if: steps.sources.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SimplexCam-0.2-beta-APK
          path: buildsrc/Casacam-Verifica-0.1-Progetto/Casacam/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
