name: Compila APK SimplexCam

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SimplexCam-0.2-beta-Sorgenti.zip'
      - '.github/workflows/simplexcam-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: APK Android di prova
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Recupera repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Estrai sorgenti
        shell: bash
        run: |
          test -f SimplexCam-0.2-beta-Sorgenti.zip
          mkdir -p buildsrc
          unzip -q SimplexCam-0.2-beta-Sorgenti.zip -d buildsrc
          chmod +x buildsrc/Casacam-Verifica-0.1-Progetto/Casacam/gradlew

      - name: Compila APK debug
        working-directory: buildsrc/Casacam-Verifica-0.1-Progetto/Casacam
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Pubblica APK da scaricare
        uses: actions/upload-artifact@v4
        with:
          name: SimplexCam-0.2-beta-APK
          path: buildsrc/Casacam-Verifica-0.1-Progetto/Casacam/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
